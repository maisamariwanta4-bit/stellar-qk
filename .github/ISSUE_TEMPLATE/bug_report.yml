name: Bug report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        Please fill in as much detail as possible so we can reproduce the issue quickly.

  - type: input
    id: version
    attributes:
      label: stellar-qk version
      description: Output of `stellar-qk --version`
      placeholder: "stellar-qk 0.1.0"
    validations:
      required: true

  - type: input
    id: rust_version
    attributes:
      label: Rust version
      description: Output of `rustc --version`
      placeholder: "rustc 1.78.0 (9b00956e5 2024-04-29)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact `stellar-qk` invocation
      render: shell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Full stdout + stderr (use code blocks)
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (network conditions, proxy, etc.)
    validations:
      required: false
